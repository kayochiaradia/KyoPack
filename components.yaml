# KyoPack — mapa de componentes
#
# Cada entrada descreve UMA fonte upstream (um repositório do GitHub). Uma
# release pode publicar mais de um arquivo útil (ex: um .nro e um .ovl
# separados) — por isso cada componente tem uma lista de "assets".
#
# Campos do componente:
#   name        nome de exibição (usado no changelog)
#   repo        "owner/repo" no GitHub
#   strip_v     remove um "v" inicial da tag antes de guardar a versão (bool)
#   assets      lista de arquivos a extrair dessa mesma release
#
# Campos de cada asset:
#   regex     regex (Python re.search) para escolher o asset certo entre
#             vários publicados na mesma release
#   place     como colocar o arquivo baixado no pacote:
#               zip-merge   -> extrai o zip direto na raiz do build/
#               zip-to      -> extrai o zip dentro de build/<dest>
#               copy-to     -> copia o arquivo (sem extrair) para build/<dest>
#   dest      caminho de destino dentro do build/ (usado por zip-to e copy-to)
#   rename    (opcional, só copy-to) nome fixo do arquivo no destino, pra não
#             mudar a cada release versionada (ex: "battery_desync_fix_v1.5.1.nro"
#             vira sempre "battery_desync_fix.nro")
#
# Para adicionar um novo componente: confirme o slug real do repositório no
# GitHub e o(s) nome(s) de asset na aba Releases antes de escrever o regex —
# não adivinhe, um slug errado baixa a coisa errada.

components:
  - name: Atmosphère
    repo: Atmosphere-NX/Atmosphere
    strip_v: false
    assets:
      # já vem com hbl/hbmenu, daybreak.nro, haze.nro e reboot_to_payload.nro
      - regex: '^atmosphere-.*\.zip$'
        place: zip-merge

  - name: hekate
    repo: CTCaer/hekate
    strip_v: true
    assets:
      - regex: '^hekate_ctcaer_[\d.]+_Nyx_[\d.]+\.zip$'
        place: zip-merge

  - name: Fizeau
    repo: averne/Fizeau
    strip_v: true
    assets:
      - regex: '^Fizeau-.*\.zip$'
        place: zip-merge

  - name: sys-clk
    repo: retronx-team/sys-clk
    strip_v: false
    assets:
      - regex: '^sys-clk-.*\.zip$'
        place: zip-merge

  - name: sys-con
    repo: cathery/sys-con
    strip_v: true
    assets:
      - regex: '^sys-con-.*\.zip$'
        place: zip-merge

  - name: SysDVR
    repo: exelix11/SysDVR
    strip_v: true
    assets:
      - regex: '^SysDVR\.zip$'
        place: zip-merge

  - name: Ultrahand Overlay
    repo: ppkantorski/Ultrahand-Overlay
    strip_v: true
    assets:
      - regex: '^sdout\.zip$'
        place: zip-merge

  - name: battery_desync_fix
    repo: CTCaer/battery_desync_fix_nx
    strip_v: false
    assets:
      - regex: '^battery_desync_fix.*\.nro$'
        place: copy-to
        dest: switch
        rename: battery_desync_fix.nro

  - name: JKSV
    repo: J-D-K/JKSV
    strip_v: false
    assets:
      - regex: '^JKSV\.nro$'
        place: copy-to
        dest: switch/JKSV

  - name: NX-Activity-Log
    repo: tallbl0nde/NX-Activity-Log
    strip_v: true
    assets:
      - regex: '^NX-Activity-Log\.nro$'
        place: copy-to
        dest: switch/NX-Activity-Log

  - name: Moonlight-Switch
    repo: XITRIX/Moonlight-Switch
    strip_v: true
    assets:
      - regex: '^Moonlight-Switch\.nro$'
        place: copy-to
        dest: switch/Moonlight-Switch

  - name: Chiaki (Akira)
    repo: xlanor/akira
    strip_v: true
    assets:
      # GUI homebrew que usa o cliente chiaki-ng para streaming remoto de PS4/PS5
      - regex: '^akira\.nro$'
        place: copy-to
        dest: switch

  - name: EdiZon
    repo: WerWolv/EdiZon
    strip_v: true
    assets:
      - regex: '^EdiZon\.nro$'
        place: copy-to
        dest: switch/EdiZon
      - regex: '^ovlEdiZon\.ovl$'
        place: copy-to
        dest: switch/.overlays
        rename: EdiZon.ovl

  - name: Linkalho
    repo: impeeza/linkalho
    strip_v: true
    assets:
      - regex: '^linkalho-.*\.zip$'
        place: zip-merge

  - name: AmiiboGenerator
    repo: Slluxx/AmiiboGenerator
    strip_v: true
    assets:
      - regex: '^AmiiboGenerator\.nro$'
        place: copy-to
        dest: switch/AmiiboGenerator

  - name: HekateToolbox
    repo: WerWolv/Hekate-Toolbox
    strip_v: true
    assets:
      - regex: '^HekateToolbox\.nro$'
        place: copy-to
        dest: switch/HekateToolbox

  - name: SwitchPoff
    repo: Storm21CH/SwitchPoff-ShutdownSwitch
    strip_v: false
    assets:
      - regex: '^SwitchPoff\..*\.zip$'
        place: zip-merge

  - name: Reboot
    repo: metehankaygsz/reboottopayloadswitch
    strip_v: false
    assets:
      - regex: '^Reboot\.nro$'
        place: copy-to
        dest: switch/Reboot

  - name: NXThemes Installer
    repo: exelix11/SwitchThemeInjector
    strip_v: false
    assets:
      - regex: '^NXThemesInstaller\.nro$'
        place: copy-to
        dest: switch/NXThemesInstaller

  # Instalador de título (NSP/XCI). Incluído por pedido explícito do
  # mantenedor, ciente de que na prática a maioria do uso desse tipo de app
  # é pra jogos baixados, não backups próprios — ver aviso legal no README.
  - name: DBI
    repo: rashevskyv/dbi
    strip_v: false
    assets:
      - regex: '^DBI\.nro$'
        place: copy-to
        dest: switch/DBI

  - name: Sphaira
    repo: ITotalJustice/sphaira
    strip_v: false
    assets:
      - regex: '^sphaira\.zip$'
        place: zip-merge

  - name: NX-Region-Manager
    repo: CostelaCNX/NX-Region-Manager
    strip_v: false
    assets:
      - regex: '^nx-region-manager\.zip$'
        place: zip-merge

# Tinfoil e LiteFoil NÃO foram adicionados por impossibilidade técnica, não
# só por política: o Tinfoil oficial é fechado e nunca foi distribuído via
# GitHub Releases (só pelo site/Patreon do autor, sem repo público). O
# LiteFoil (ahoyallu/LiteFoil, mapeado por outros pack builders da cena) foi
# removido do GitHub e não existe mais em nenhum fork ativo encontrado — sem
# repo real não tem o que apontar aqui.
#
# NPShop segue deliberadamente FORA por outro motivo: o próprio autor
# descreve o ecossistema oficial (NPShop.org) como um backend ligado ao
# Google Drive pra "gerenciamento de biblioteca de jogos" com "geração de
# catálogo Tinfoil" — ou seja, é uma ferramenta de distribuição de catálogo
# de jogos, não um instalador genérico como o DBI. Além disso o repo do
# cliente (NPShopOrg/NPShopSwitch) não publica nenhuma release no GitHub, o
# que também inviabilizaria automatizar o download por aqui.
